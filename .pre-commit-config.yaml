repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      # Committing a file that still carries <<<<<<< / >>>>>>> has broken main
      # more than once: the backend stopped importing and the frontend stopped
      # building, and both went unnoticed because CI was already red.
      - id: check-merge-conflict
      # backend/.env was committed with a live SECRET_KEY and stayed tracked for
      # months, because .gitignore has no effect on a file git already knows
      # about. This catches the next one at the point it is first added.
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-env-files
        name: refuse to commit environment files
        entry: >-
          Environment files carry real credentials. Commit the matching
          .env.example instead. If this file is already tracked, untrack it with
          `git rm --cached <file>` -- adding it to .gitignore is not enough.
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: \.example$

      - id: no-scratch-files
        name: refuse to commit developer scratch files
        entry: >-
          Single-use codemods and API-response dumps do not belong in the
          repository -- linters, test collection and CodeQL all walk them.
        language: fail
        files: (^|/)(fix|fix_.*|patch_.*|resolve_merge)\.py$|(^|/)pr[0-9]+\.json$

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [ --fix ]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, json]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - typescript
