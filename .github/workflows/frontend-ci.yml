name: frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          node-version: 22

      - name: Install
        run: npm ci 2>&1

      - name: Build
        run: npm run build 2>&1

      # Building a component and running it are different questions. `vite
      # build` bundled `_app.settings.tsx` happily while the module threw
      # `ReferenceError` the moment React called it, and the test written to
      # cover that page was red for four days under a green `frontend` tick,
      # because nothing here ran it (#1316).
      #
      # After the build on purpose: a failing test is more useful to read than
      # a failing test that might just be a bad bundle, and the install is
      # already warm either way.
      #
      # e2e is excluded here, as in `npm run test` -- Playwright needs browsers
      # and a server, which is a separate job when somebody wants it.
      - name: Test
        run: npm run test

      # src/routeTree.gen.ts is generated from the filenames in src/routes/ and
      # committed. That only works if something fails when the two disagree,
      # and nothing did -- `showcase.tsx` and `verify-email.tsx` were live
      # routes that the committed tree had never heard of, which cost `tsc`
      # eleven errors while the app itself was fine (#1248).
      #
      # The build above already regenerated it, so this is a free comparison
      # rather than a second generation step.
      - name: Check the committed route tree matches the generated one
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::src/routeTree.gen.ts is out of date."
            echo
            echo "It is generated from the files in src/routes/, so adding or"
            echo "renaming a route means regenerating and committing it:"
            echo
            echo "    cd frontend && npm run build"
            echo "    git add src/routeTree.gen.ts"
            echo
            echo "Leaving it stale does not break the app -- the build"
            echo "regenerates it -- but it breaks 'tsc' and every editor."
            echo
            git diff --stat -- src/routeTree.gen.ts
            exit 1
          fi
          echo "Route tree is up to date."
