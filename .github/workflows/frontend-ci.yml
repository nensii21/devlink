name: frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          node-version: 22

      - name: Install
        run: npm ci 2>&1

      # Ordered cheapest-first: a file that does not parse should fail in
      # seconds, not after a full production build.
      - name: Type check
        run: npm run typecheck 2>&1

      - name: Test
        run: npm test 2>&1

      - name: Build
        run: npm run build 2>&1
