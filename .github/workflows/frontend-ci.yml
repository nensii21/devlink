name: frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - run: npm run build
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Lint check
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test:coverage
